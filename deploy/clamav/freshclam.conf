# freshclam config — sourced from /etc/clamav/freshclam.conf
#
# freshclam downloads ClamAV signature databases into DatabaseDirectory and
# keeps them current. Running it in daemon mode means it polls the mirrors
# periodically without us having to schedule cron.
#
# Reference: https://docs.clamav.net/manual/Usage/SignatureManagement.html

# Run as the unprivileged clamav user.
DatabaseOwner clamav

# Where the signatures live — must match clamd.conf's DatabaseDirectory.
DatabaseDirectory /var/lib/clamav

# Where freshclam logs go (supervisord captures stdout too).
UpdateLogFile /var/log/clamav/freshclam.log
LogTime yes
LogFileMaxSize 5M
LogRotate yes
LogVerbose no
LogSyslog no

# Identify ourselves on the mirrors — must be at least 1 char.
DatabaseMirror database.clamav.net

# Poll for updates every 24 hours when run as a daemon (-d).
Checks 1

# Daemon mode — supervisord owns the process; freshclam.conf alone doesn't
# enable it, supervisor passes the `-d` flag.
Foreground yes

# Reload clamd whenever new signatures land. We don't use the notify socket
# here because clamd has its own SelfCheck cadence (10 minutes) which keeps
# its in-memory DB fresh after freshclam writes new files.
# NotifyClamd /etc/clamav/clamd.conf

# Sensible network timeouts.
ConnectTimeout 30
ReceiveTimeout 30

# Don't fail the boot if the mirror is briefly slow.
MaxAttempts 5

# Privacy / safety — don't fetch optional extra DBs we don't need.
SafeBrowsing no
Bytecode yes
