# ClamAV daemon config — sourced from /etc/clamav/clamd.conf
#
# Tuned for the Wayly backend: listens on BOTH the standard Debian unix socket
# (/var/run/clamav/clamd.ctl) AND TCP loopback (127.0.0.1:3310). The Python
# `clamd` client in upload_security.py prefers the socket and falls back to TCP.
#
# Reference: https://docs.clamav.net/manual/Usage/Configuration.html

# Run in the foreground so supervisord owns the process.
Foreground yes

# Logging — supervisord captures stdout/stderr; also keep a file for forensics.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogClean no
LogFileMaxSize 10M
LogSyslog no
LogVerbose no
LogRotate yes

# Run as the unprivileged clamav user (the package created it).
User clamav

# Database location populated by freshclam.
DatabaseDirectory /var/lib/clamav

# --- transports ---
# Local unix socket (preferred — fastest, no TCP overhead).
LocalSocket /var/run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes

# TCP loopback — keep enabled so the backend's fallback path works.
TCPSocket 3310
TCPAddr 127.0.0.1

# --- scan tunables ---
# Statement PDFs from providers can occasionally be large; allow up to 100MB so
# the daemon doesn't refuse to scan before the application-side 20MB cap kicks
# in. Anything bigger is rejected by upload_security.assert_size().
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000

# Reject encrypted / password-protected archives — they can't be scanned and
# are a common smuggling vector for malware in HR / aged-care contexts.
AlertEncryptedArchive yes
AlertEncryptedDoc yes
# Phishing heuristics — we accept and surface them as detections.
PhishingScanURLs yes
HeuristicScanPrecedence yes

# Polite shutdown so supervisord restarts behave.
ExitOnOOM yes
SelfCheck 600

# Don't follow symlinks or scan mailboxes — irrelevant for our pipeline.
FollowDirectorySymlinks no
FollowFileSymlinks no
ScanMail no
