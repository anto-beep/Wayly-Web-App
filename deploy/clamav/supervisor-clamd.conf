; ClamAV daemon — managed by supervisord.
;
; Started AFTER the entrypoint script has run freshclam at least once, so the
; signature DB at /var/lib/clamav/main.cvd (or daily.cvd) exists. If we start
; clamd without a DB it exits with code 50 ("Can't load database") and
; supervisord enters a backoff loop.
;
; The unix socket at /var/run/clamav/clamd.ctl is created on startup; if the
; socket directory was lost to a tmpfs wipe, the entrypoint recreates it.

[program:clamd]
command=/usr/sbin/clamd --foreground=true --config-file=/etc/clamav/clamd.conf
user=root
autostart=true
autorestart=true
startsecs=15
startretries=10
priority=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/clamd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/clamd.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOME="/var/lib/clamav"
