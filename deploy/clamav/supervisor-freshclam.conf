; freshclam — signature database updater. Polls the ClamAV mirror every 24h
; (Checks=1 in /etc/clamav/freshclam.conf) and writes refreshed signatures
; into /var/lib/clamav. Runs as the unprivileged clamav user.
;
; The first synchronous fetch happens in the entrypoint before supervisord
; starts; this program keeps the DB current thereafter.

[program:freshclam]
command=/usr/bin/freshclam --daemon --foreground=true --stdout --config-file=/etc/clamav/freshclam.conf
user=clamav
autostart=true
autorestart=true
startsecs=10
startretries=10
priority=4
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/freshclam.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/freshclam.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
environment=HOME="/var/lib/clamav"
