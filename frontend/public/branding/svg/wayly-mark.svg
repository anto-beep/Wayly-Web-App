<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wayly mark">
  <title>Wayly mark</title>
  <rect width="512" height="512" rx="112" fill="#1F3A5F"/>
  <!-- Hand-holding-heart silhouette: a single rounded heart cradled by an arc that suggests an open palm. -->
  <g transform="translate(256 268)">
    <!-- Supporting arc (the "hand") -->
    <path d="M -132 38 C -132 86, -78 130, 0 130 C 78 130, 132 86, 132 38" stroke="#D4A24E" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- Heart -->
    <path d="M 0 56 C -10 38, -34 18, -58 18 C -90 18, -110 44, -110 70 C -110 116, -52 152, 0 188 C 52 152, 110 116, 110 70 C 110 44, 90 18, 58 18 C 34 18, 10 38, 0 56 Z" fill="#D4A24E" transform="translate(0 -110) scale(0.74)"/>
  </g>
</svg>
