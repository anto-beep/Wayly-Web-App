<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wayly mark">
  <title>Wayly mark</title>
  <defs>
    <linearGradient id="wg-w-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E7BD9"/>
      <stop offset="55%" stop-color="#2BC4D6"/>
      <stop offset="100%" stop-color="#6FE3DA"/>
    </linearGradient>
    <linearGradient id="wg-w-fill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E7BD9"/>
      <stop offset="100%" stop-color="#1456A3"/>
    </linearGradient>
    <linearGradient id="wg-w-fill2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FE3DA"/>
      <stop offset="100%" stop-color="#2BC4D6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <!-- Left V (deep blue) -->
  <path d="M 92 128 L 168 128 L 232 384 L 188 384 Z" fill="url(#wg-w-fill1)"/>
  <!-- Inner-left V (cyan/mint) -->
  <path d="M 188 384 L 232 384 L 256 256 L 232 128 L 168 128 Z" fill="url(#wg-w-fill2)" opacity="0.92"/>
  <!-- Right V (deep blue) -->
  <path d="M 420 128 L 344 128 L 280 384 L 324 384 Z" fill="url(#wg-w-fill1)"/>
  <!-- Inner-right V (cyan/mint) -->
  <path d="M 324 384 L 280 384 L 256 256 L 280 128 L 344 128 Z" fill="url(#wg-w-fill2)" opacity="0.92"/>
</svg>
