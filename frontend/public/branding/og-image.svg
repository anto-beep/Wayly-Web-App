<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Wayly, Aged Care, Made Clear.">
  <title>Wayly, Aged Care, Made Clear.</title>
  <defs>
    <linearGradient id="og-warmth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F4EFE7"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm off-white canvas -->
  <rect width="1200" height="630" fill="url(#og-warmth)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Wayly logo mark, upper left -->
  <g transform="translate(80, 70) scale(0.18)">
    <path
      d="M 88 132 C 88 124, 96 116, 108 116 L 124 116 C 134 116, 142 122, 145 132 L 196 312 L 240 152 C 244 138, 254 130, 268 132 C 280 134, 290 142, 294 156 L 332 308 L 388 132 C 391 122, 400 116, 410 116 L 426 116 C 438 116, 446 124, 446 132"
      fill="none" stroke="#0E4D52" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"
    />
    <circle cx="446" cy="132" r="22" fill="#A5512B"/>
  </g>
  <text x="180" y="120" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#0E4D52" letter-spacing="-0.5">Wayly</text>

  <!-- Headline — Fraunces serif -->
  <text x="80" y="290" font-family="Fraunces, Georgia, serif" font-size="84" font-weight="600" fill="#1C2B2D" letter-spacing="-1.5">Support at Home,</text>
  <text x="80" y="386" font-family="Fraunces, Georgia, serif" font-size="84" font-weight="600" fill="#1C2B2D" letter-spacing="-1.5">finally <tspan fill="#0E4D52">explained.</tspan></text>

  <!-- Subhead — Inter sans -->
  <text x="80" y="465" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#524B42">For Australian families navigating aged care funding,</text>
  <text x="80" y="505" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#524B42">statements and care plans.</text>

  <!-- Wayfinder clay pill -->
  <rect x="80" y="550" width="220" height="44" rx="22" fill="#A5512B"/>
  <text x="190" y="579" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">wayly.com.au</text>

  <!-- Subtle wave at the bottom right — calls back the brand wave divider -->
  <path d="M 700 630 C 800 580, 900 600, 1000 570 C 1100 540, 1150 560, 1200 540 L 1200 630 Z" fill="#0E4D52" opacity="0.08"/>
  <path d="M 800 630 C 900 600, 1000 610, 1100 590 C 1150 580, 1180 590, 1200 580 L 1200 630 Z" fill="#0E4D52" opacity="0.15"/>
  <path d="M 950 630 C 1050 615, 1100 620, 1200 610 L 1200 630 Z" fill="#0E4D52" opacity="0.25"/>
</svg>
