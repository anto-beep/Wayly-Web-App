# INV-1 v1.2 · Tool Registry (spec §12A, S2)
#
# Single source of truth for every tool that appears anywhere in the product.
# Every surface (tools grid, sidebar, pricing, About, Ask Wayly, marketing,
# mobile) reads from this file — either directly (backend) or via the mirrored
# JS module at frontend/src/config/toolRegistry.js.
#
# The tool count shown anywhere is derived from `count-featured` in this file,
# never hardcoded. Adding a new tool means one PR to this file plus wiring the
# frontend/backend route, and the count updates automatically.
#
# Editorial rules apply to every string.

