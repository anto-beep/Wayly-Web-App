  # -------------------------------------------------------------------------
  # C5 - "Jean" reference profile.
  #   Jean: significant hands-on help across ADLs and IADLs, notable
  #   cognitive change, recurrent falls or one hospital visit. Composite
  #   target ~ 0.54.
  # -------------------------------------------------------------------------
  - classification: 5
    profile_summary: >
      Jean-style profile. Significant hands-on help across most ADLs and
      IADLs. Notable cognitive change with regular disorientation. Recurrent
      falls or a recent ED visit. Informal support at low levels.
    vector:
      Q1_self_care_shower:        moderate
