  # -------------------------------------------------------------------------
  # C6 — Substantial ADL support most days, cognition prominent.
  #   Margaret Chen (prompt §9.1) sits close to this vector but is a Branch A
  #   fixture, not the canonical C6 vignette. Composite target ≈ 0.66.
  # -------------------------------------------------------------------------
  - classification: 6
    profile_summary: >
      Substantial daily-care needs. Hands-on help for most ADLs. Cognitive
      change is prominent, prompts needed throughout the day. Multiple falls
      or an ED visit. Home isn't well suited without modifications.
    vector:
      Q1_self_care_shower:        significant
      Q2_self_care_dress:         significant
      Q3_self_care_mobility:      significant
      Q4_self_care_continence:    significant
