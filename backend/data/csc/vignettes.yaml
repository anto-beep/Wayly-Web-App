# CSC-1 reference vignettes (v1 DRAFT — awaiting Antony's Phase 0 sign-off)
#
# One synthetic answer vector per classification (1..8). Vectors are the
# ground truth used to compute vignette-anchored confidence per CSC-1 §5.4.
#
# Answer keys map to the normalised score in CSC-1 §5.1:
#   5-point difficulty (Q1..Q11, Q15): "no_difficulty=0, slight=1, moderate=2,
#                                       significant=3, cannot_alone=4"
#   5-point frequency  (Q12):          "never=0, rarely=1, sometimes=2,
#                                       often=3, every_day=4"
#   Count              (Q13, Q14):     "zero=0, one=1.3, two_to_three=2.7,
#                                       more_than_three=4"
#   Amount, inverse    (Q16):          "full_time=0, a_lot=1, some=2,
#                                       a_little=3, none=4"
#
# Calibration sources
#   - DoH classification descriptions per Aged Care Rules 2025 s.229-5, s.194-5.
#   - Published industry vignettes: Robert (C3), Wendy (C4), Jean (C5).
#   - Wayly fixtures: Louisa Davids (C8) prompt §9, Margaret Chen (C6) prompt §9.1
#     (Margaret is a Branch-A fixture, not a canonical vignette — she sits between
#      the C6 vignette and the C5 vignette by design).
#
# Sign-off rule
#   Scoring code, threshold constants, and confidence math are NOT written until
#   Antony has approved these eight vectors. This is the Phase 0 gate (CSC-1 §3.E).

schema_version: csc.vignettes.v1
effective_from: 2026-02-01
legislativeVerificationStatus: PENDING     # Wayly-defined calibration, not statutory

vignettes:

  # -------------------------------------------------------------------------
  # C1 — Fully independent, minimal support
  #   DoH shorthand: living independently, no personal-care need, some IADL
  #   assistance available on request. Composite target ≈ 0.05.
  # -------------------------------------------------------------------------
  - classification: 1
    profile_summary: >
      Independent older adult in own home. Manages personal care and most
      household tasks without help. Occasional support for heavy shopping
      or gardening. No cognitive or mood concerns.
    vector:
      Q1_self_care_shower:        no_difficulty
      Q2_self_care_dress:         no_difficulty
      Q3_self_care_mobility:      no_difficulty
      Q4_self_care_continence:    no_difficulty
      Q5_iadl_meals:              no_difficulty
      Q6_iadl_cleaning_laundry:   slight
      Q7_iadl_medication:         no_difficulty
      Q8_iadl_shopping:           slight
      Q9_iadl_transport:          no_difficulty
      Q10_cognition:              no_difficulty
      Q11_mood:                   no_difficulty
      Q12_behaviour:              never
      Q13_falls_6mo:              zero
      Q14_hospital_12mo:          zero
      Q15_home_environment:       slight
      Q16_informal_support:       some          # inverse-scored

  # -------------------------------------------------------------------------
  # C2 — Mostly independent, occasional personal-care prompts
  # -------------------------------------------------------------------------
  - classification: 2
    profile_summary: >
      Mostly independent but slowing down. Uses aids for showering. Needs
