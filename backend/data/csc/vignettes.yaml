  #   Composite target ≈ 0.78.
  # -------------------------------------------------------------------------
  - classification: 7
    profile_summary: >
      Near-continuous personal-care needs. Hands-on help required for all
      ADLs. Cognitive change limits independent decision-making. Behavioural
