    vector:
      Q1_self_care_shower:        slight
      Q2_self_care_dress:         slight
      Q3_self_care_mobility:      slight
      Q4_self_care_continence:    no_difficulty
      Q5_iadl_meals:              slight
      Q6_iadl_cleaning_laundry:   moderate
      Q7_iadl_medication:         slight
      Q8_iadl_shopping:           moderate
      Q9_iadl_transport:          slight
      Q10_cognition:              slight
      Q11_mood:                   slight
      Q12_behaviour:              rarely
      Q13_falls_6mo:              zero
      Q14_hospital_12mo:          zero
      Q15_home_environment:       slight
      Q16_informal_support:       some

