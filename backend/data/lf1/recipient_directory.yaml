# LF-1 Recipient Directory — INDEX-1 pattern.
#
# Central registry of every entity a Letters & Follow-ups user might address.
# Each record carries: entity name, purpose, phone, email (if published),
# portal URL, postal address, complaints URL, typical response window,
# citation source, citation date, notes on when to use.
#
# CI drift detection: URL health check plus citation-age check.
# Manual review cadence: quarterly.
#
# Per-provider records are dynamic and cached on the participant profile;
# they are NOT stored here. Only the fixed regulator / national contact
# records live in this file.
