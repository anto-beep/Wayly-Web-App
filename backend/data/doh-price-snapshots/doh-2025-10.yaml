# DoH Support at Home indicative price snapshot — October 2025.
#
# Source: Department of Health, "Summary of indicative Support at Home prices",
# published October 2025. The figures reflect a February 2025 survey of ~300
# HCP providers (~one third of the market) and describe standard business
# hours only. Nursing hourly figures include the cost of everyday nursing
# consumables the nurse carries.
#
# PPC-1 v2 §WS1 — this file is IMMUTABLE once a snapshot ships. Future
# quarterly publications from DoH land as new files (e.g. doh-2026-q1.yaml).
# Errata to an existing snapshot follow the documented process, not silent
# edits.
#
# Fields per row:
#   service              — display name matching the SAH service list.
#   service_code         — internal stable slug (kebab-case).
#   stream               — Clinical | Independence | Everyday Living.
#   unit                 — hour | trip | meal.
#   median               — AUD.
#   range_lower          — AUD; nullable when the DoH row does not publish one.
#   range_upper          — AUD; nullable when the DoH row does not publish one.
#   available            — true when DoH publishes a range for this service.
#   checkable            — false when comparison is inappropriate regardless of
#                          range availability (flat-fee monthly, per-km, etc.).
#   notes                — inline caveat surfaced on the result card.
#   source_citation      — page reference within the DoH PDF.
snapshot_id: "doh-2025-10"
source_publication: "DoH Summary of indicative Support at Home prices"
source_date: "2025-10-01"
source_url: "https://www.health.gov.au/resources/publications/summary-of-indicative-support-at-home-prices"
regional: false
sample_note: "Based on a February 2025 DoH survey of ~300 HCP providers, roughly one third of the market. Standard business hours only."

