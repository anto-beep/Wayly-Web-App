# CPR-FINDINGS-UX-1 v2 · Workstream A1 — Rule Registry (single source of truth).
#
# Every citation-bearing finding CPR-1 can emit MUST have a rule_id here.
# Findings without a rule_id are structurally impossible to emit (freeform
# observations are permitted only as severity:info / confidence:low with
# source "Verification required" and NO cited authority).
#
# confidence_tier is bound to source_type per locked decision L3:
#   legislation | rules            -> high
#   standard | regulator_guidance  -> medium
#   clinical_best_practice         -> low
#
# All six categories carry solicitor_signed_off: false (see
# cpr-categories-v1.yaml). Until a category is signed off at category level,
# its citation-bearing findings are suppressed in production.
#
# EXPLICITLY BANNED (enforced by CI test test_cpr_err_a_golden.py):
#   * Minimum RN hours per classification (does not exist in SAH).
#   * National transport price midpoints while price caps are inactive.
#   * Any minimum service hours by classification not published in the
#     Schedule of Subsidies and Supplements or the Aged Care Rules 2025.
version: 1
rules:
  # ----------------------------------------------------------------- financial
  - rule_id: CPR-R-0001
    finding_title: "Care management fee exceeds 10% of care services base"
    category_id: financial
    source_type: rules
    source_citation: "Aged Care Rules 2025 (F2025L01173) s.194-3"
    source_url: "/help/aged-care-rules-2025#s194-3"
    confidence_tier: high
    severity: compliance
    triggers:
      - condition: "care_management_fee > care_services_base * 0.10"
    suggested_question: "The plan lists a care management fee above 10% of the care services base. Can you walk me through how it was calculated?"
    addressee_primary: provider
    addressee_secondary: [acqsc, opan]
    introduces_new_source_type: false
    introduces_new_legal_claim: false

  - rule_id: CPR-R-0002
    finding_title: "AT-HM items counted inside the care management base or quarterly budget"
    category_id: financial
    source_type: rules
    source_citation: "Aged Care Rules 2025 (F2025L01173) s.212-10"
    source_url: "/help/aged-care-rules-2025#s212-10"
    confidence_tier: high
    severity: compliance
    triggers:
      - condition: "at_hm_included_in_base == true"
    suggested_question: "The Assistive Technology and Home Modifications amount looks like it is inside the care budget. Should it be ring-fenced separately?"
    addressee_primary: provider
    addressee_secondary: [acqsc]
    introduces_new_source_type: false
    introduces_new_legal_claim: false

  - rule_id: CPR-R-0003
    finding_title: "Rollover cap set incorrectly"
    category_id: financial
    source_type: rules
    source_citation: "Aged Care Rules 2025 (F2025L01173) s.194-3"
    source_url: "/help/aged-care-rules-2025#s194-3"
    confidence_tier: high
    severity: efficiency
    triggers:
      - condition: "rollover_cap != max(1000, quarterly_budget * 0.10)"
    suggested_question: "Can you confirm the unspent-funds rollover cap for this quarter and how it was worked out?"
    addressee_primary: provider
    addressee_secondary: [my_aged_care]
    introduces_new_source_type: false
    introduces_new_legal_claim: false

