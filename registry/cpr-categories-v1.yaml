# CPR-FINDINGS-UX-1 v2 · Workstream A1 — Rule Registry categories.
#
# Category-level solicitor sign-off per locked decision L2. A citation-bearing
# finding whose category maps here with `solicitor_signed_off: false` is
# SUPPRESSED in production and shown only in the internal review console.
# New rules added inside an already-signed-off category do not require
# re-sign-off unless they introduce a new `source_type` or a new legal claim
# (see `introduces_new_source_type` / `introduces_new_legal_claim` on the rule).
#
# 20/06/2026 — Solicitor category-level sign-off received for all six
# categories (founder-relayed). The interim citation mitigation (M1-M4) is
# retired; registry-bound citations now flow to participants.
version: 1
categories:
